<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="./style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="blog">
    <article class="blog-card ">
      <section class="card-content">
        <img class="pic" src="./assets/images/illustration-article.svg" alt="An illustration of coding symbols."/>
        <section class="topic-tag">
          <p>Learning</p>
        </section>

        <section class="card-date">
          <p>Published <time datetime="2023-12-21">21 Dec 2023</time></p>
        </section>

        <section class="card-title">
          <h1><a class="card-link" href="#">HTML & CSS foundations</a></h1>
        </section>

        <section class="card-description">
          <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </section>

        <section class="author">
          <img class="avatar-pic" src="./assets/images/image-avatar.webp" alt="A profile picture of the blog's author."/>
          <p>Greg Hooper</p>
        </section>
      </section>
    </article>
  </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Joshua Williams</a>.
    </footer>

</body>
</html>
